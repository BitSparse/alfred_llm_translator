name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .alfredworkflow
        run: bash build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: DS-Translator.alfredworkflow
          generate_release_notes: true
